<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{产品名称} — {版本号}</title>
    <!-- Phase 0 设计系统 -->
    <link rel="stylesheet" href="design-system/colors.css">
    <link rel="stylesheet" href="design-system/effects.css">
    <link rel="stylesheet" href="design-system/badges.css">
    <link rel="stylesheet" href="design-system/layers.css">
    <link rel="stylesheet" href="design-system/table-advanced.css">
    <!-- App Shell 自有 CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- ECharts 暗黑主题（Phase 0 产出） -->
    <script src="design-system/echarts-dark-theme.js"></script>
</head>
<body>
    <!-- ====== 左侧导航栏 ====== -->
    <aside id="sidebar">
        <!-- Logo 区域 -->
        <div class="sidebar-logo">
            <div class="sidebar-logo__icon">{产品简称首字}</div>
            <div class="sidebar-logo__text">
                <span class="sidebar-logo__title">{产品名称}</span>
                <span class="sidebar-logo__version">{版本号}</span>
            </div>
        </div>

        <!-- 菜单区域 -->
        <nav class="sidebar-nav">
            <!-- 菜单项由 app-shell.js 根据 spec.json 动态渲染 -->
            <div id="sidebar-menu"></div>
        </nav>

        <!-- 底部信息 -->
        <div class="sidebar-footer">
            <div class="sidebar-footer__status">
                <span class="status-dot status-dot--online"></span>
                系统运行中
            </div>
        </div>
    </aside>

    <!-- ====== 右侧主区域 ====== -->
    <div id="main-area">
        <!-- 顶部状态栏 -->
        <header id="header">
            <div class="header-left">
                <span class="header-breadcrumb" id="header-breadcrumb">首页</span>
            </div>
            <div class="header-right">
                <!-- 告警铃铛 -->
                <div class="header-alert-bell" title="全局告警">
                    <svg class="bell-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="bell-count" id="alert-count">3</span>
                </div>
                <!-- 用户信息 -->
                <div class="header-user">
                    <span class="header-user__avatar">管</span>
                    <span class="header-user__name">安全管理员</span>
                </div>
            </div>
        </header>

        <!-- === View Component 挂载点 === -->
        <!-- 所有 FE-Agent 生成的页面渲染到此容器内 -->
        <main id="app-content">
            <!-- 骨架屏（数据就绪后由 View Component 整体替换） -->
            <div class="cyber-skeleton">
                <div class="skeleton-header"></div>
                <div class="skeleton-grid">
                    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
                </div>
                <div class="skeleton-table"></div>
            </div>
        </main>
    </div>

    <!-- ====== JS 脚本加载（按依赖顺序） ====== -->
    <!-- 0. 全局配置（双模 API 适配器开关，必须在所有 View Component 之前加载） -->
    <script>window.APP_CONFIG = { USE_MOCK: true };</script>

    <!-- 1. 路由引擎 -->
    <script src="js/router.js"></script>

    <!-- 2. View Components（每个模块一个文件，IIFE 包裹互不干扰） -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/asset.js"></script>
    <script src="js/views/host-risk.js"></script>
    <script src="js/views/web-risk.js"></script>
    <script src="js/views/attack.js"></script>
    <script src="js/views/system.js"></script>

    <!-- 3. Visual Decorators（Phase 1.1b 产出，无侵入 DOM 装饰） -->
    <script src="js/decorators/dashboard_decorator.js"></script>
    <script src="js/decorators/asset_decorator.js"></script>
    <script src="js/decorators/host_risk_decorator.js"></script>
    <script src="js/decorators/web_risk_decorator.js"></script>
    <script src="js/decorators/attack_decorator.js"></script>
    <script src="js/decorators/system_decorator.js"></script>

    <!-- 4. App Shell 初始化（最后加载，依赖路由+视图+装饰器全部就绪） -->
    <script src="js/app-shell.js"></script>
</body>
</html>
